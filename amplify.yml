version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - until [ -f pnpm-workspace.yaml ] || [ "$PWD" = "/" ]; do cd ..; done
            - test -f pnpm-workspace.yaml
            - corepack enable
            - corepack prepare pnpm@9.12.2 --activate
            - echo "node-linker=hoisted" >> .npmrc
            - HUSKY=0 pnpm install --frozen-lockfile
        build:
          commands:
            - until [ -f pnpm-workspace.yaml ] || [ "$PWD" = "/" ]; do cd ..; done
            - test -f pnpm-workspace.yaml
            - pnpm turbo run build --filter=@bya/web
      artifacts:
        baseDirectory: .next
        files:
          - "**/*"
      cache:
        paths:
          - ../../node_modules/**/*
          - .next/cache/**/*
