name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

# Least privilege by default: no job needs to write to the repo.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # `pnpm lint` is `turbo run lint`, and turbo's task graph only walks the
      # workspaces under apps/* and packages/*. Nothing at the repo root was
      # ever covered — a scripts/reconcile-payouts.ts would go unchecked while
      # this pipeline reported green. Root files were gated only by lint-staged,
      # which does not run in CI and is bypassable with `--no-verify`.
      - name: Lint repo-root files
        run: pnpm lint:root

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # A green test suite once coexisted with an API that could not serve a
      # single database-backed request: server.ts was missing its connectDb()
      # call, and every test opened its own connection through the test
      # harness. Only booting the built artifact and calling it found that.
      # This runs dist/server.js against a real mongod — no Atlas credentials
      # needed, using the binary mongodb-memory-server already caches.
      - name: Smoke test the built artifact
        run: bash apps/api/scripts/smoke.sh

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high
